# 풀 docker 빌드 오버레이 — `make up-all`로 base(docker/docker-compose.yml)와 병합.
# 앱 3종을 이미지로 빌드해 기동. (네이티브 dev는 `make dev` 사용)
# 직접: docker compose --project-directory . -f docker/docker-compose.yml -f docker/docker-compose.full.yml up -d --build
# 경로(context: . / dockerfile: apps/*/Dockerfile / env_file: .env.*)는 --project-directory(=repo root) 기준.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env.${ENV:-dev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env.${ENV:-dev}
    ports:
      - "3000:3000"
    depends_on:
      - api

  extractor:
    build:
      context: ./python/extractor
      dockerfile: Dockerfile
    env_file:
      - .env.${ENV:-dev}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
