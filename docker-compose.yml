# 기본(make up): 인프라만 — postgres + redis. 앱(api/web/extractor)은 `make dev`로 네이티브 실행.
# 풀 docker 빌드는 `make up-all` (docker-compose.full.yml 병합).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mcpproxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: mcpproxy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpproxy"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
