services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mcpproxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: mcpproxy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpproxy"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./apps/api
    env_file:
      - .env.${ENV:-dev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./apps/web
    env_file:
      - .env.${ENV:-dev}
    ports:
      - "3000:3000"
    depends_on:
      - api

  extractor:
    build: ./python/extractor
    env_file:
      - .env.${ENV:-dev}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  pgdata:
