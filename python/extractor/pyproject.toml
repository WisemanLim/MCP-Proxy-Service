[project]
name = "mcp-proxy-extractor"
version = "0.1.0"
description = "LLM 기반 비정형 문서 → OpenAPI 스펙 추출 배치 (PRD §4.6)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "openapi-spec-validator>=0.7",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
]

[tool.uv]
package = false
